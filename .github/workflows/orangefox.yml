name: OrangeFox 11.1 Build

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'OrangeFox Branch ( e.g., 11.0 )'
        required: true
        default: '11.0'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/g4bri3ldll/twrp_motorola_hawaiip'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/motorola/hawaiip'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'hawaiip'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_hawaiip'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'boot'
      USER_NAME:
        description: 'Git Username'
        required: true
        default: 'g4bri3ldll'
      USER_EMAIL:
        description: 'Git Email'
        required: true
        default: 'gabrielalves.dasilva.0983@gmail.com'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Fox Branch: ${{ github.event.inputs.FOX_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt install git aria2 -y
        mkdir ofx_scripts
        cd ofx_scripts
        git clone https://gitlab.com/OrangeFox/misc/scripts 
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Run OrangeFox Legacy Sync Script
      id: pwd
      run: |
        git config --global user.name "${{ github.event.inputs.USER_NAME }}"
        git config --global user.email "${{ github.event.inputs.USER_EMAIL }}"
        
        # Clona o repositório de sync oficial do OrangeFox
        git clone https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync
        cd ~/OrangeFox_sync
        
        # Cria um link simbólico para a pasta patches onde o script legado espera encontrar
        ln -s legacy/patches patches
        
        # Executa o script legado apontando para a branch 11.0 e criando a workspace
        mkdir -p ~/workspace
        bash legacy/orangefox_sync_legacy.sh --branch ${{ github.event.inputs.FOX_BRANCH }} --path ~/workspace
        
        echo "workspace-folder=/home/runner/workspace" >> $GITHUB_OUTPUT

    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: | 
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*vendor*.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Fox Branch: ${{ github.event.inputs.FOX_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
