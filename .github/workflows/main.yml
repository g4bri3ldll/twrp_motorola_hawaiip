name: OrangeFox - Builder R11.1 Official Sync

on:
  workflow_dispatch:

jobs:
  build:
    name: 🦊 Build OrangeFox R11.1
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions: write-all
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean up Environment
      run: |
        sudo apt-get update
        sudo apt-get autoremove -y
        sudo apt-get autoclean -y
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /share/swift /usr/share/swift

    - name: Install Official Dependencies
      run: |
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 repo

    - name: Set up Git Configuration
      run: |
        git config --global user.name "g4bri3ldll"
        git config --global user.email "gabrielalves.dasilva.0983@gmail.com"

    - name: Sync OrangeFox Base (fox_11.0 Branch)
      run: |
        mkdir fox_11.0
        cd fox_11.0
        repo init --depth=1 -u https://gitlab.com -b fox_11.0
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

    - name: Clone Your Device Tree
      run: |
        cd fox_11.0
        git clone --depth=1 -b android-12.1 https://github.com device/motorola/hawaiip

    - name: Compile OrangeFox R11.1
      run: |
        cd fox_11.0
        set +e
        source build/envsetup.sh
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_VERSION="R11.1"
        export FOX_BUILD_TYPE="Stable"
        export OF_MAINTAINER="g4bri3ldll"
        
        lunch twrp_hawaiip-eng || lunch omni_hawaiip-eng
        
        make clean
        mka bootimage -j$(nproc --all)

    - name: Upload Release to GitHub
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        files: |
          fox_11.0/out/target/product/hawaiip/OrangeFox-*.zip
          fox_11.0/out/target/product/hawaiip/*.img
        tag_name: OrangeFox-R11.1-hawaiip-${{ github.run_id }}
        name: OrangeFox Recovery R11.1 - Motorola G22 (hawaiip)
        body: |
          Compilação automatizada baseada no script oficial orangefox_sync_legacy.sh.
          Dispositivo: Motorola G22 (hawaiip)
          Versão do OrangeFox: R11.1 Stable
