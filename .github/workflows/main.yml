name: OrangeFox 14.1 - Builder

on:
  workflow_dispatch:

jobs:
  build:
    name: 🦊 Building OrangeFox 14.1 Recovery
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    permissions: write-all
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space & Aggressive Cleanup
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        df -h

    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 10240
        swap-size-mb: 10240
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'

    - name: Redirect Apt Cache to Big Disk
      run: |
        sudo mkdir -p ${GITHUB_WORKSPACE}/apt-cache/partial
        sudo mkdir -p ${GITHUB_WORKSPACE}/apt-cache/lists/partial
        echo "Dir::Cache \"${GITHUB_WORKSPACE}/apt-cache\";" | sudo tee /etc/apt/apt.conf.d/99cache
        echo "Dir::Cache::Archives \"archives/\";" | sudo tee -a /etc/apt/apt.conf.d/99cache

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git repo bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev \
          libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev libncurses5

    - name: Configure Git Credentials
      run: |
        git config --global user.name 'g4bri3ldll'
        git config --global user.email 'gabrielalves.dasilva.0983@gmail.com'

    - name: Initialize OrangeFox 14.1 Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        repo init -u https://gitlab.com/OrangeFox/manifest.git -b fox_14.1 --depth=1

    - name: Sync Sources
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git clone https://github.com/g4bri3ldll/twrp_motorola_hawaiip -b android-12.1 device/motorola/hawaiip

    - name: Start Compilation
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch omni_hawaiip-eng || lunch twrp_hawaiip-eng
        mka bootimage

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-14.1-hawaiip-Recovery
        path: |
          OrangeFox/out/target/product/hawaiip/*.img
          OrangeFox/out/target/product/hawaiip/*.zip
